name: housekeeping

# Keeps the org under GitHub's shared storage quota (the free plan's 500 MB covers private
# artifacts and private packages together; v0.43.0 of website failed an upload on it).
# scripts/housekeeping.sh keeps the newest 4 runs' artifacts per workflow and the newest 4
# tagged versions of every image, with the platform manifests those tags reference.
#
# Needs the HOUSEKEEPING_TOKEN secret: a classic PAT with repo, read:packages and
# delete:packages (GITHUB_TOKEN cannot touch other repositories' artifacts or packages).
on:
  schedule:
    - cron: '17 4 * * *'   # daily; a release can fill the quota in a day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would be deleted'
        type: boolean
        default: true

permissions: {}

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.HOUSEKEEPING_TOKEN }}
          KEEP: '4'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "HOUSEKEEPING_TOKEN is not set"; exit 1; }
          ./scripts/housekeeping.sh
