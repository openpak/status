name: housekeeping

# Keeps the org under GitHub's shared storage quota (the free plan's 500 MB covers private
# artifacts and private packages together; v0.43.0 of website failed an upload on it).
# scripts/housekeeping.sh keeps the newest 4 runs' artifacts per workflow, deletes every
# artifact older than 3 days, and keeps the newest 4 tagged versions of every image, with the
# platform manifests those tags reference. It never touches releases.
#
# Needs the HOUSEKEEPING_TOKEN secret: a classic PAT with repo, read:packages and
# delete:packages (GITHUB_TOKEN cannot touch other repositories' artifacts or packages).
on:
  schedule:
    - cron: '17 4 * * *'   # daily; a release can fill the quota in a day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would be deleted'
        type: boolean
        default: true

# contents: read is needed for the checkout of this private repo; everything else goes through
# HOUSEKEEPING_TOKEN.
permissions:
  contents: read

jobs:
  clean:
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v5
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ secrets.HOUSEKEEPING_TOKEN }}
          KEEP: '4'
          MAX_AGE_DAYS: '3'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "HOUSEKEEPING_TOKEN is not set"; exit 1; }
          ./scripts/housekeeping.sh
      - name: Clear scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch"
