  - name: NAT check, second server (10125)
    group: Core
    url: udp://145.241.228.207:10125
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Relay (TURN)
    group: Core
    # coturn for NPLN titles, reached over UDP (the consoles' TURN URL says transport=udp; TCP 3478 is not open to the
    # internet). A bare UDP dial only sees a closed port, since Gatus cannot send a STUN request.
    url: udp://145.241.199.19:3478
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

