# OpenPak network status.
#
# This runs on a different machine from everything it watches. A status page on
# the production box reports "up" right until the moment it cannot report at
# all, which is the only moment anyone reads it.
#
# Two kinds of check live here. The public surface goes through Cloudflare, the
# way a person reaches it, so a check passing means what a visitor experiences
# is working — not merely that a process is alive. The console path is probed
# straight at the origin IP, because those hostnames resolve to Nintendo for
# everyone else; a console only reaches us through its own DNS redirect, so a
# check that followed public DNS would be monitoring Nintendo.

storage:
  type: sqlite
  path: /data/status.db

ui:
  title: OpenPak status
  header: OpenPak
  description: Live status of the OpenPak network.
  link: https://openpak.org

endpoints:
  # ---- What a person uses ----
  - name: Website
    group: Public
    url: https://openpak.org/
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: Rankings
    group: Public
    # The rankings hub, and the public API behind it (valid JSON with a games list, even when empty).
    url: https://openpak.org/rankings
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: Rankings API
    group: Public
    url: https://openpak.org/api/v1/rankings
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"games\"*)"

  - name: Accounts
    group: Core
    url: https://api.openpak.org/healthz/core
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Console link page
    group: Public
    # The page a phone opens to link a console; served by the Switch adapter
    # through the account host, so this covers both.
    url: https://link.openpak.org/link
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  # The services behind the site. They listen only on the deploy host, so the
  # website answers for them: /healthz/<service> runs the service's own health
  # check and says up (200) or down (503).
  - name: Cloud saves
    group: Core
    url: https://openpak.org/healthz/saves
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Messages
    group: Core
    url: https://openpak.org/healthz/chat
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Game leaderboards
    group: Core
    # The neutral leaderboards core every console's score server stores into.
    url: https://openpak.org/healthz/leaderboards
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Game achievements
    group: Core
    # The neutral achievements core behind every console's trophies and achievements.
    url: https://openpak.org/healthz/achievements
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Shop catalog
    group: Core
    # The neutral shop catalog core behind every console's shop (Switch mirrored, Wii U native).
    url: https://openpak.org/healthz/shop-core
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Game title storage
    group: Core
    # The neutral title storage core behind every console's per-game player data.
    url: https://openpak.org/healthz/title-storage
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Game matchmaking
    group: Core
    # The neutral matchmaking core behind every console's rooms, lobbies and game search.
    url: https://openpak.org/healthz/matchmaking
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Database connections
    group: Core
    # Postgres client connections: the website answers 503 from 240, which is 80% of max_connections=300.
    url: https://openpak.org/healthz/db-connections
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  # ---- What a console uses ----
  # These names are Nintendo's. The container maps them to the origin IP, so
  # the check reaches our adapter exactly as a console does. TLS verification
  # is off because the certificates are signed by the OpenPak CA, which is the
  # whole point of them.
  - name: Device auth
    group: Console
    url: https://dauth-lp1.ndas.srv.nintendo.net/v8/challenge
    method: POST
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].challenge != null"

  - name: Unity sign-in (Gang Beasts)
    group: Console
    # Unity's player-auth name, answered by ugs: an anonymous sign-in returns an idToken.
    url: https://player-auth.services.api.unity.com/v1/authentication/anonymous
    method: POST
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].idToken != null"

  - name: Unity lobby (Gang Beasts)
    group: Console
    # Without a token the lobby host refuses with 401: it is ugs answering.
    url: https://lobby.services.api.unity.com/v1/lobbies/query
    method: POST
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 401"

  - name: Account service
    group: Console
    # The key set the console verifies every token against: if this is wrong,
    # nothing else the console does can succeed.
    url: https://e0d67c509fb203858ebcb2fe3f88c2aa.baas.nintendo.com/1.0.0/certificates
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].keys[0].kid != null"

  - name: Default profile picture
    group: Console
    # Every account without a picture of its own is pointed here, and a 404
    # stops "add account" with 2124-7404 -- twice now, because the picture
    # was a file someone placed by hand rather than something the build
    # carried. Watched from off-box so a deploy that loses it is noticed in a
    # minute rather than by a person at a console.
    url: https://cdn-image-e0d67c509fb203858ebcb2fe3f88c2aa.baas.nintendo.com/1/default
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) > 1000"

  - name: Sign-in page
    group: Console
    url: https://accounts.nintendo.com/connect/1.0.0/authorize
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"

  - name: Licence service
    group: Console
    # A 404 here is not an outage but it stops account setup, which is why it
    # is watched separately from the rest.
    url: https://dragons.hac.lp1.dragons.nintendo.net/v2/elicenses/exercise
    method: POST
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"

  # ---- What a game session uses ----
  # NPLN hands each Stardew/Wonder session an address on the origin IP; the
  # gRPC side can be perfectly healthy while this port is unreachable, which
  # is exactly how 2026-09-15 went: the rootless port forwarder died, the
  # container lived, and every farm join failed for a day. Probed as a bare
  # TCP connect, the same thing Pia does first.
  - name: Stardew session port
    group: Console
    url: tcp://145.241.199.19:22200
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: Wonder session port
    group: Console
    url: tcp://145.241.199.19:22220
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: Terraria session port
    group: Console
    url: tcp://145.241.199.19:24540
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  # A NEX title's secure port is dialled straight from the station URL its login
  # hands out, the same way a joiner dials an NPLN session port.
  - name: Streets of Rage 4 secure port
    group: Console
    url: tcp://145.241.199.19:22881
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: Risk of Rain secure port
    group: Console
    url: tcp://145.241.199.19:22891
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: Risk of Rain Returns secure port
    group: Console
    url: tcp://145.241.199.19:23001
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  # ---- What an Xbox 360 uses ----
  # The gateway forwards Live services to the primary's Traefik with a key that
  # only it holds. Without it the identity headers are dropped, so a service that
  # needs them refuses with 403 and the rest answer an empty request their own
  # way (each check says which). Either answer means "routed and running": a
  # missing route is 404 and a stopped container 502.
  - name: Console DNS
    group: Xbox 360
    # x360-dns on the secondary: Xbox Live names resolve to the OpenPak boxes.
    url: 145.241.228.207
    dns:
      query-name: xemacs.xboxlive.com
      query-type: A
    interval: 120s
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 145.241.228.207"

  - name: Accounts and profile recovery
    group: Xbox 360
    # An empty 0x645 request: x360-xuacs answers "malformed request".
    url: http://145.241.199.19/xuacs/PassportMemberNameExists.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 400"

  - name: Presence and friends
    group: Xbox 360
    url: http://145.241.199.19/xpnfront/xpresence.srf
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 403"

  - name: Messages
    group: Xbox 360
    url: http://145.241.199.19/xpnfront/xmessaging.srf
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 403"

  - name: Profile text check
    group: Xbox 360
    # An empty XStringVerify: x360-msgserver answers "short request".
    url: http://145.241.199.19/msgserver/vetstring2.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 400"

  - name: Country information
    group: Xbox 360
    url: http://145.241.199.19/xedl/ProfileInfo/103/CountryInfo.cib
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) == 128"

  - name: Certificate validation
    group: Xbox 360
    # Answers only once x360-xsig has the WLID CA from x360-xuacs (503 before),
    # so this also watches that link; sign-in fails without it.
    url: http://145.241.199.19/xsig/ValidateCertificate.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) == 12"

  - name: Revocation list
    group: Xbox 360
    url: http://145.241.199.19/xbos/GetRevocationList.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) == 276"

  - name: Profile settings
    group: Xbox 360
    url: http://145.241.199.19/xstats/readsettings.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 403"

  - name: Matchmaking
    group: Xbox 360
    url: http://145.241.199.19/xmatch/xmatchclient2.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 403"

  - name: Leaderboards
    group: Xbox 360
    url: http://145.241.199.19/xstats/xstatread.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 403"

  - name: Ranked match arbitration
    group: Xbox 360
    url: http://145.241.199.19/XArb/Register.ashx
    method: POST
    interval: 120s
    conditions:
      - "[STATUS] == 403"

  - name: Online dashboard modules
    group: Xbox 360
    # x360-som: the signed system.online.manifest XAM fetches from UpdateUriRoot1, by the content host name.
    url: http://145.241.199.19/fffe07d1/manifests/0/system.online.manifest
    headers:
      Host: content.xboxlive.com
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(XMNP*)"

  # ---- What a PS3 uses ----
  # Probed by the firmware's own host names (mapped to the origin in the
  # quadlet), so each check crosses Traefik and np-account to the service, the
  # same path a console takes.
  - name: Leaderboards
    group: PS3
    # A real leaderboard read: reaches np-score and, behind it, the leaderboards core.
    url: http://ranking-view.np.community.playstation.net/ranking_view/func/get_ranking
    method: POST
    body: '<?xml version="1.0" encoding="utf-8"?><ranking platform="ps3" sv="4.93"><titleid>NPWR04270_00</titleid><board>1</board><start>1</start><list-max>1</list-max><option message="false" info="false"/></ranking>'
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*result=\"00\"*)"

  - name: Trophies
    group: PS3
    # Trophy discovery: reaches np-account and np-trophy, which stores through the achievements core.
    url: http://static-resource.np.community.playstation.net/np/resource/trophy/trophy-status.xml
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*status=\"alive\"*)"

  - name: Title User Storage
    group: PS3
    url: http://static-resource.np.community.playstation.net/np/resource/title/NPWR04270_00/storage/NPWR04270_00-storage.xml
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*status=\"alive\"*)"

  - name: XMB feeds
    group: PS3
    # Plain HTTP: the console fetches this over TLS, but the PS3 front offers only
    # ciphers Go's client refuses, so a TLS probe here fails while consoles work.
    url: http://nsx.sec.np.dl.playstation.net/nsx/sec/Xz78TMQ1Uf31VCYr/c/NSXWSV/NSXWSV-PN.P3.US-WHATSNEW01.xml
    interval: 300s
    conditions:
      - "[STATUS] == 200"

  - name: Sign-in
    group: PS3
    # No credentials: an empty token request reaches np-account's OAuth handler,
    # which answers with its own error. Plain HTTP for the same cipher reason.
    url: http://auth.np.ac.playstation.net/2.0/oauth/token
    method: POST
    body: "x"
    interval: 120s
    conditions:
      - "[STATUS] == 400"
      - "[BODY] == pat(*grant_type is required*)"

  - name: Profiles
    group: PS3
    # A profile read with a malformed JID: np-account forwards it to np-community,
    # whose handler rejects it by name.
    url: http://getprof.us.np.community.playstation.net/basic_view/func/get_profile
    method: POST
    body: "<profile><jid>x@a.b</jid></profile>"
    interval: 120s
    conditions:
      - "[STATUS] == 400"
      - "[BODY] == pat(*invalid JID*)"

  - name: Friends
    group: PS3
    # The roster rides the XMPP stream (TLS from the firmware), so a connect check.
    url: tcp://145.241.199.19:5223
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Presence
    group: PS3
    url: tcp://145.241.199.19:5223
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Game update checks
    group: PS3
    # np-update answers "no update" as an empty 404; np-account's own 404 has a body,
    # so an empty body proves the request reached np-update.
    url: http://a0.ww.np.dl.playstation.net/tpl/np/BLES01938/BLES01938-ver.xml
    interval: 300s
    conditions:
      - "[STATUS] == 404"
      - "len([BODY]) == 0"

  - name: Message attachments
    group: PS3
    # A download with a junk ticket: np-uploader rejects it with result 02.
    url: http://uploader.np.community.playstation.net/uploader/sec/download_data
    method: POST
    body: '<?xml version="1.0" encoding="utf-8"?><uploader><ticket>AAAA</ticket></uploader>'
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*result=\"02\"*)"

  - name: Online save storage
    group: PS3
    # The signed Online Storage discovery file (np-ubs through np-account).
    url: http://static-resource.np.community.playstation.net/np/resource/ubstorage/ubstorage.xml
    interval: 300s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*status=\"alive\"*)"

  # ---- What a PS4 uses ----
  - name: System update checks
    group: PS4
    # ps4-update answers "nothing newer" (version 00.000.000, no image), so a
    # body carrying that version proves the request reached ps4-update.
    url: http://dus01.ps4.update.playstation.net/update/ps4/list/us/ps4-updatelist.xml
    interval: 300s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*00.000.000*)"

  # ---- What an original Xbox uses ----
  # xb-auth (88/udp) is generated below. The private APIs bind the primary's
  # ZeroTier address and are mutual-TLS, so a TCP connect from the status host
  # (also on ZeroTier) is the deepest probe it can make. xb-enroll is not probed:
  # its port is firewalled to the dev machine only.
  - name: Gateway
    group: Original Xbox
    url: udp://145.241.228.207:3074
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Discovery DNS
    group: Original Xbox
    # xb-dns binds the primary's ZeroTier address; Xbox names resolve to the auth host.
    url: 10.212.63.196
    dns:
      query-name: macs.xboxlive.com
      query-type: A
    interval: 120s
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 145.241.199.19"

  - name: Accounts
    group: Original Xbox
    url: tcp://10.212.63.196:26111
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Terms of use
    group: Original Xbox
    url: tcp://10.212.63.196:26112
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Friends and presence
    group: Original Xbox
    url: tcp://10.212.63.196:26115
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Voice chat
    group: Original Xbox
    url: tcp://10.212.63.196:26117
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Signing keys
    group: Original Xbox
    url: tcp://10.212.63.196:26118
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: System messages
    group: Original Xbox
    url: tcp://10.212.63.196:26119
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Messages
    group: Original Xbox
    url: tcp://10.212.63.196:26120
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Online storage
    group: Original Xbox
    url: tcp://10.212.63.196:26122
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Player feedback
    group: Original Xbox
    url: tcp://10.212.63.196:26123
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: Auto-update referral
    group: Original Xbox
    url: tcp://10.212.63.196:26124
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  # ---- The public site: every page and API a person or the app uses ----

  - name: Sign-in page
    group: Public
    url: https://openpak.org/login
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Account registration
    group: Public
    url: https://openpak.org/register
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Titles catalogue
    group: Public
    # The catalogue the titles page, the app and the emulators read.
    url: https://openpak.org/api/v1/titles
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"titles\"*)"

  - name: Downloads
    group: Public
    url: https://openpak.org/downloads
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Help centre
    group: Public
    url: https://openpak.org/help
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: App API
    group: Public
    # api.openpak.org is the host the phone app and the emulators call.
    url: https://api.openpak.org/healthz
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"service\":\"website\"*)"

  - name: Network profile
    group: Public
    # What the app and the console patchers download to learn which hosts to redirect.
    url: https://openpak.org/api/v1/network/profile
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"version\"*)"

  - name: Redirect ceiling
    group: Public
    # The signed list of names a console may be redirected for. A 404 here drops whole families from console DNS at its next boot.
    url: https://openpak.org/api/v1/network/ceiling
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*payload*)"

  - name: Network CA certificate
    group: Public
    url: https://openpak.org/ca.pem
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*BEGIN CERTIFICATE*)"

  - name: Companion data
    group: Public
    url: https://openpak.org/api/v1/companion/titles
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"titles\"*)"

  - name: News feed
    group: Public
    url: https://openpak.org/feed/news.xml
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<feed*)"

  - name: Regions list
    group: Public
    url: https://openpak.org/api/v1/regions
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"regions\"*)"

  - name: Logs viewer
    group: Public
    # The admin log viewer answers with a redirect to sign-in: the route is up and behind its gate.
    url: https://openpak.org/admin/logs
    interval: 120s
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 303"

  # ---- Companion sites ----

  - name: OpenVerse
    group: Sites
    # verse.openpak.org: the Miiverse replacement.
    url: https://verse.openpak.org/healthz
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(ok*)"

  - name: OpenVerse Lite
    group: Sites
    # lite.verse.openpak.org is plain HTTP on our own edge for the PS3, Wii and DSi browsers; their DNS resolves it to the box, so the probe goes straight to the origin with that Host.
    url: http://145.241.199.19/
    headers:
      Host: lite.verse.openpak.org
    interval: 120s
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"

  - name: Open Kart
    group: Sites
    url: https://kart.openpak.org/healthz
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(ok*)"

  - name: SplatNet
    group: Sites
    url: https://splat.openpak.org/
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: Mario Maker courses
    group: Sites
    # Also reports when each game's course sync last succeeded.
    url: https://maker.openpak.org/healthz
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].ok == true"

  - name: Rewards
    group: Sites
    url: https://rewards.openpak.org/healthz
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(ok*)"

  - name: Documentation
    group: Sites
    url: https://docs.openpak.org/
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  # ---- Core services every network shares ----

  - name: Network registry
    group: Core
    # The v2 registry the console and emulator builds fetch their bundles from.
    url: https://openpak.org/healthz/registry
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Rewards
    group: Core
    url: https://openpak.org/healthz/rewards
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Parental controls
    group: Core
    # The neutral parental core that nx-pctl and OpenVerse read.
    url: https://openpak.org/healthz/parental
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Voice chat
    group: Core
    url: https://openpak.org/healthz/voice
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  - name: Mod catalogue
    group: Core
    url: https://openpak.org/healthz/mods
