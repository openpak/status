  - name: Console DNS
    group: Core
    # nn-sssl-dns answers OpenPak names with the box. Only an OpenPak name is ever asked, so the lockdown stays shut.
    url: 145.241.199.19
    dns:
      query-name: account.openpak.org
      query-type: A
    interval: 120s
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 145.241.199.19"

  - name: NAT check, first server (10025)
    group: Core
    # nn-nncs for the Switch, Wii U and 3DS. A console needs two servers on two addresses, each on 10025 and 10125; the probe is a bare UDP dial, so it sees a closed port and not a stopped process.
    url: udp://145.241.199.19:10025
    interval: 120s
    conditions:
      - "[CONNECTED] == true"

  - name: NAT check, first server (10125)
    group: Core
    url: udp://145.241.199.19:10125
    interval: 120s
    conditions:
