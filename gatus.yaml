  # ---- A Wii or DS: Wiimmfi-style Nintendo WFC ----

  - name: DS login
    group: Wii/DS
    # An action=login request with no credentials: wfc-nas answers returncd=103 (MTAz).
    url: http://nas.openpak.org/ac
    method: POST
    body: "action=bG9naW4*"
    headers:
      Content-Type: application/x-www-form-urlencoded
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*returncd=*)"

  - name: Wii login
    group: Wii/DS
    url: http://naswii.openpak.org/ac
    method: POST
    body: "action=bG9naW4*"
    headers:
      Content-Type: application/x-www-form-urlencoded
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*returncd=*)"

  - name: Plain-HTTP front (port 80)
    group: Core
    # http-hostfix (prds#144): the Wii's NAS login carries the Host header twice; before the
    # shim Traefik answered 400. Send exactly that over raw TCP and expect a 200.
    url: tcp://nas.openpak.org:80
    body: "POST /ac HTTP/1.1\r\nHost: nas.openpak.org\r\nHost: nas.openpak.org\r\nContent-Type: application/x-www-form-urlencoded\r\nContent-Length: 23\r\nConnection: close\r\n\r\naction=YWNjdGNyZWF0ZQ**"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[BODY] == pat(HTTP/1.1 200*)"

  - name: Wii/DS game-port front
    group: Wii/DS
    # wfc-front (prds#149): GPCM, server browser, QR2 and NATNEG reach the services through it with
    # the player's real address (PROXY v2). GPCM speaks first: its greeting means the whole path is up.
    url: tcp://145.241.199.19:29900
    body: "\n"
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[BODY] == pat(*lc*challenge*)"

  - name: Wii/DS linking
    group: Wii/DS
    # Link-first (prds#139): unlinked consoles are refused with a code and linked at openpak.org/link.
    # wfc-api's pairing counters through wfc-nas's /api/ proxy: the pairing tables answer.
    url: http://available.gs.openpak.org/api/pair/stats
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*linked_consoles*)"

