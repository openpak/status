    # Traefik; a request that is not SOAP gets 400.
    url: https://ecs.wup.shop.openpak.org/ecs/services/ECommerceSOAP
    method: POST
    headers:
      Content-Type: text/xml; charset=utf-8
      SOAPAction: urn:ecs.wsapi.broadon.com/GetAccountStatus
    body: '<?xml version="1.0" encoding="UTF-8"?><SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ecs="urn:ecs.wsapi.broadon.com"><SOAP-ENV:Body><ecs:GetAccountStatus><ecs:Version>2.0</ecs:Version><ecs:MessageId>EC-0-0</ecs:MessageId><ecs:DeviceId>0</ecs:DeviceId><ecs:AccountId>0</ecs:AccountId><ecs:Region>EUR</ecs:Region><ecs:Country>IE</ecs:Country></ecs:GetAccountStatus></SOAP-ENV:Body></SOAP-ENV:Envelope>'
    interval: 120s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<ErrorCode>0</ErrorCode>*)"
      - "[BODY] == pat(*<Region>EUR</Region>*)"

